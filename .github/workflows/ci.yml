name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check church_system accounts permissions sitecontrol --select E9,F63,F7,F82 --ignore E501

  test-sqlite:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: church_system.settings
      CHURCHHUB_FILE_LOGS: "false"
      CHURCHHUB_CELERY_BEAT: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django check
        run: python manage.py check
      - name: Verify migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Collectstatic
        run: python manage.py collectstatic --noinput
      - name: Run tests with coverage (SQLite)
        run: coverage run --source='.' manage.py test --verbosity=1
      - name: Coverage report
        run: coverage report --fail-under=50

  test-postgresql:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "True"
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: church_system.settings
      DJANGO_ALLOW_DEBUG_IN_PROD: "True"
      CHURCHHUB_FILE_LOGS: "false"
      CHURCHHUB_CELERY_BEAT: "false"
      DB_ENGINE: postgresql
      DB_NAME: churchhub
      DB_USER: churchhub
      DB_PASSWORD: churchhub
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: churchhub
          POSTGRES_USER: churchhub
          POSTGRES_PASSWORD: churchhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U churchhub -d churchhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests (PostgreSQL + Redis)
        run: python manage.py test --verbosity=1

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
