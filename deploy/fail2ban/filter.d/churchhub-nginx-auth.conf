# Fail2Ban filter: repeated POSTs to ChurchHub auth endpoints (Nginx access log).
#
# Prerequisite: Cloudflare real-IP restored so $remote_addr is the visitor
# (deploy/nginx/cloudflare-realip.conf). Otherwise bans hit Cloudflare anycast.
#
# Note: Django form login usually returns HTTP 200 on bad password (not 401).
# This filter watches POST volume on auth paths, complementing
# LoginRateLimitMiddleware — not a replacement for it.
#
# Expected log format (combined):
#   203.0.113.10 - - [06/Aug/2026:20:00:00 +0000] "POST /accounts/login/ HTTP/1.1" 200 ...

[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "POST /accounts/login[^\"]*" \d+
            ^<HOST> - \S+ \[[^\]]+\] "POST /portal/login[^\"]*" \d+
            ^<HOST> - \S+ \[[^\]]+\] "POST /accounts/mfa/verify[^\"]*" \d+
ignoreregex =
