# ChurchHub Fail2Ban — Nginx auth POST abuse (DISABLED by default)
#
# Enable only after Cloudflare real-IP is verified:
#   1. include deploy/nginx/cloudflare-realip.conf in TLS server
#   2. confirm access.log shows visitor IPs (not 104.x / 172.64.x CF ranges)
#   3. sudo fail2ban-regex /var/log/nginx/access.log \
#        /etc/fail2ban/filter.d/churchhub-nginx-auth.conf
#   4. set enabled = true below (or override in jail.local)
#   5. sudo fail2ban-client reload
#
# Install:
#   sudo cp deploy/fail2ban/filter.d/churchhub-nginx-auth.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/churchhub-nginx-auth.conf /etc/fail2ban/jail.d/

[churchhub-nginx-auth]
enabled = false
port = http,https
filter = churchhub-nginx-auth
# Adjust if the site uses a dedicated access log path:
logpath = /var/log/nginx/access.log
            /var/log/nginx/churchhub.access.log
backend = auto
maxretry = 20
findtime = 10m
bantime = 30m
ignoreip = 127.0.0.1/8 ::1
# Prefer iptables-multiport / nftables matching the host default chain
action = %(action_)s
