# ChurchHub Fail2Ban overrides — sshd
#
# Install:
#   sudo cp deploy/fail2ban/jail.d/churchhub-sshd.conf /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#
# Before applying: compare with live jail so you do not weaken protection:
#   sudo fail2ban-client status sshd
#   sudo fail2ban-client get sshd maxretry findtime bantime ignoreip
#
# If live values are stricter, keep the stricter settings (edit this file or
# leave the live jail.d overlay as-is).

[sshd]
enabled = true
# Ubuntu 24.04: prefer journal backend when available
backend = systemd
port = ssh
filter = sshd
maxretry = 5
findtime = 10m
bantime = 1h
# Never ban the host itself; add office/VPN CIDRs after the space:
ignoreip = 127.0.0.1/8 ::1
