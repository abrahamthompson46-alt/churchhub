# ChurchHub — Nginx reverse proxy (self-host / VPS)
# Place behind TLS terminator or terminate TLS here with certbot.
# Upstream: Gunicorn on 127.0.0.1:8000

upstream churchhub_app {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name churchhub.example.com;

    # Redirect HTTP → HTTPS (enable after certs)
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    # ACME / Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /opt/churchhub/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/churchhub/media/;
        expires 1d;
        add_header Cache-Control "private";
    }

    location /health/ {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

