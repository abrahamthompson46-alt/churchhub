# ChurchHub — Nginx (Ubuntu VPS)
#
# Phase A — IP access (HTTP, before domain/TLS):
#   - Set server_name to your VPS public IP (and optionally _)
#   - Django .env: SECURE_SSL_REDIRECT=false
#   - DJANGO_ALLOWED_HOSTS=<ip>
#   - DJANGO_CSRF_TRUSTED_ORIGINS=http://<ip>
#   - CHURCHHUB_PUBLIC_URL=http://<ip>
#
# Phase B — Domain + Let's Encrypt:
#   - Update server_name to the domain
#   - Uncomment the TLS server block and HTTP→HTTPS redirect
#   - Django .env: SECURE_SSL_REDIRECT=true (default)
#   - CSRF / PUBLIC_URL use https://your.domain
#
# Gunicorn must listen on 127.0.0.1:8000 (default gunicorn.conf.py).

upstream churchhub_app {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 32;
}

# ── Phase A / ACME HTTP ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    # Replace with VPS IP now; add domain later, e.g.:
    # server_name 203.0.113.10 example.com www.example.com;
    server_name _;

    # After TLS is live, uncomment:
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /opt/churchhub/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Direct media URLs (current templates). Keep permissions: churchhub:www-data, 750 dirs / 640 files.
    location /media/ {
        alias /opt/churchhub/media/;
        expires 1d;
        add_header Cache-Control "private";
    }

    location /health/ {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # Browser hardening (app also sets Django security headers)
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }
}

