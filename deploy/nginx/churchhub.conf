# ChurchHub — Nginx (Ubuntu VPS / zreta.com)
#
# WEBROOT: replace __WEBROOT__ before enabling, e.g.:
#   sed 's|__WEBROOT__|/home/churchhub/apps/churchhub|g' churchhub.conf
# (also used historically: /opt/churchhub)
#
# Cloudflare dashboard: SSL/TLS mode = Full (Strict). Origin cert = Let's Encrypt
# (or Cloudflare Origin CA). Install real-IP snippet:
#   sudo cp deploy/nginx/cloudflare-realip.conf /etc/nginx/snippets/cloudflare-realip.conf
#
# Django .env (required once TLS + Cloudflare are live):
#   SECURE_SSL_REDIRECT=true
#   DJANGO_ALLOWED_HOSTS=zreta.com,www.zreta.com
#   DJANGO_CSRF_TRUSTED_ORIGINS=https://zreta.com,https://www.zreta.com
#   CHURCHHUB_PUBLIC_URL=https://zreta.com
#   MEDIA_X_ACCEL_REDIRECT=true   # default when DJANGO_DEBUG=False
#
# Gunicorn must listen on 127.0.0.1:8000.

upstream churchhub_app {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 32;
}

# ── ACME + HTTP → HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name zreta.com www.zreta.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── TLS ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zreta.com www.zreta.com;

    ssl_certificate     /etc/letsencrypt/live/zreta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zreta.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 25m;

    location /static/ {
        alias __WEBROOT__/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public branding (login logos) — anonymous OK
    location /media/platform/branding/ {
        alias __WEBROOT__/media/platform/branding/;
        expires 1d;
        add_header Cache-Control "public";
    }

    location /media/denominations/branding/ {
        alias __WEBROOT__/media/denominations/branding/;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Private media bytes — only after Django returns X-Accel-Redirect
    location /internal-media/ {
        internal;
        alias __WEBROOT__/media/;
    }

    # All other /media/* → Django auth gate (protected_media view)
    location /media/ {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health/ {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location / {
        proxy_pass http://churchhub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
