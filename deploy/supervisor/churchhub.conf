; Optional Supervisor alternative to systemd (self-host)
[program:churchhub-web]
command=/opt/churchhub/.venv/bin/gunicorn --config /opt/churchhub/gunicorn.conf.py church_system.wsgi:application
directory=/opt/churchhub
user=churchhub
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/churchhub/logs/gunicorn.log
environment=DJANGO_SETTINGS_MODULE="church_system.settings",DJANGO_ENV="production"

[program:churchhub-celery]
command=/opt/churchhub/.venv/bin/celery -A church_system worker --loglevel=INFO --concurrency=2
directory=/opt/churchhub
user=churchhub
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/churchhub/logs/celery-worker.log
environment=DJANGO_SETTINGS_MODULE="church_system.settings",DJANGO_ENV="production"

[program:churchhub-celerybeat]
command=/opt/churchhub/.venv/bin/celery -A church_system beat --loglevel=INFO --schedule=/opt/churchhub/var/celerybeat-schedule
directory=/opt/churchhub
user=churchhub
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/opt/churchhub/logs/celery-beat.log
environment=DJANGO_SETTINGS_MODULE="church_system.settings",DJANGO_ENV="production"

[group:churchhub]
programs=churchhub-web,churchhub-celery,churchhub-celerybeat
