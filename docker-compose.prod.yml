# Production overlay — do not publish Postgres or Redis on the host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Set POSTGRES_PASSWORD, DJANGO_SECRET_KEY, and MFA_ENCRYPTION_KEY in `.env`.
# Do not use this stack as a substitute for host firewall + TLS at Nginx.

services:
  db:
    ports: []

  redis:
    ports: []

  web:
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ENV: production
      DJANGO_SETTINGS_MODULE: church_system.settings.production
