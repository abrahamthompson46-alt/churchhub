services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: churchhub
      POSTGRES_USER: churchhub
      POSTGRES_PASSWORD: churchhub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churchhub -d churchhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: docker-dev-secret-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ENV: development
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_SETTINGS_MODULE: church_system.settings
      DB_ENGINE: postgresql
      DB_NAME: churchhub
      DB_USER: churchhub
      DB_PASSWORD: churchhub
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHURCHHUB_PUBLIC_URL: http://localhost:8000
      CHURCHHUB_FILE_LOGS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - ./logs:/app/logs

  celery:
    build: .
    command: celery -A church_system worker -l info --concurrency=2
    environment:
      DJANGO_SECRET_KEY: docker-dev-secret-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: church_system.settings
      DB_ENGINE: postgresql
      DB_NAME: churchhub
      DB_USER: churchhub
      DB_PASSWORD: churchhub
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CHURCHHUB_FILE_LOGS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media

  celerybeat:
    build: .
    command: celery -A church_system beat -l info --schedule=/app/var/celerybeat-schedule
    environment:
      DJANGO_SECRET_KEY: docker-dev-secret-change-in-production
      DJANGO_DEBUG: "True"
      DJANGO_ENV: development
      DJANGO_SETTINGS_MODULE: church_system.settings
      DB_ENGINE: postgresql
      DB_NAME: churchhub
      DB_USER: churchhub
      DB_PASSWORD: churchhub
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      CHURCHHUB_CELERY_BEAT: "true"
      CHURCHHUB_FILE_LOGS: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - celerybeat_data:/app/var

volumes:
  pgdata:
  media_data:
  celerybeat_data:
