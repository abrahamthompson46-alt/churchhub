<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Sign-in code</title></head>
<body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #222;">
  <p>Hello {{ user.get_username }},</p>
  <p>Your <strong>{{ site_name }}</strong> sign-in code is:</p>
  <p style="font-size: 28px; letter-spacing: 4px; font-weight: bold;">{{ code }}</p>
  <p>This code expires in {{ ttl_minutes }} minutes.</p>
  <p style="color: #666; font-size: 14px;">If you did not try to sign in, ignore this email and contact your administrator.</p>
  <p>— {{ site_name }}</p>
</body>
</html>
