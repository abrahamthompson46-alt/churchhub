{% if empty_title or empty_message %}
<div class="ch-empty-state{% if compact %} ch-empty-state--compact{% endif %}">
    {% if empty_icon %}<i class="bi {{ empty_icon }} ch-empty-state__icon" aria-hidden="true"></i>{% endif %}
    {% if empty_title %}<p class="ch-empty-state__title">{{ empty_title }}</p>{% endif %}
    {% if empty_message %}<p class="ch-empty-state__message text-muted mb-0">{{ empty_message }}</p>{% endif %}
</div>
{% endif %}
