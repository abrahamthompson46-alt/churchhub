{% if module_tabs %}

<nav class="module-tabs module-tabs--sticky" aria-label="Section navigation">

    <div class="module-tabs-scroll">

        {% for tab in module_tabs %}

        <a href="{% if tab.report_key %}{% url 'reports:run' tab.report_key %}{% else %}{% url tab.url_name %}{% endif %}"

           class="module-tab{% if tab.report_key and report_key == tab.report_key %} is-active{% elif not tab.report_key and current_view == tab.url_name %} is-active{% endif %}">

            {% if tab.icon %}<i class="bi {{ tab.icon }}"></i>{% endif %}

            <span>{{ tab.label }}</span>

        </a>

        {% endfor %}

    </div>

</nav>

{% endif %}
