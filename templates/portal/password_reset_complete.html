{% extends "base.html" %}

{% block title %}Password updated — Member Portal{% endblock %}
{% block body_class %}auth-page auth-page--portal{% endblock %}

{% block content %}
<div class="page-container" style="max-width:28rem;margin:3rem auto;">
    <div class="card">
        <div class="card-body p-4 p-md-5 text-center">
            <h1 class="h4 mb-2">Password updated</h1>
            <p class="text-muted">You can now sign in with your new password.</p>
            <a href="{% url 'portal:login' %}" class="btn btn-primary btn-sm">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
