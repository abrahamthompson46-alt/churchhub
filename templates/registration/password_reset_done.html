{% extends "base.html" %}
{% block title %}Check Your Email — ChurchHub{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-split-form mx-auto" style="min-height:100vh;display:flex;align-items:center;">
    <div class="auth-card card"><div class="card-body p-4 p-md-5 text-center">
        <div class="empty-state-icon mx-auto mb-3"><i class="bi bi-envelope-check"></i></div>
        <h1 class="h4 fw-bold">Check your email</h1>
        <p class="text-muted small">If an account exists, you'll receive password reset instructions shortly.</p>
        <a href="{% url 'login' %}" class="btn btn-primary btn-sm mt-3">Return to sign in</a>
    </div></div>
</div>
{% endblock %}
