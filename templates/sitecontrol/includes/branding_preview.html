<div class="platform-card platform-card--compact platform-brand-preview" id="brandPreview">
    <div class="platform-card-header">Live preview</div>
    <div class="platform-card-body">
        <div class="platform-brand-preview__nav mb-2">
            <span class="platform-brand-preview__dot"></span>
            <span class="small text-white">{{ preview_name|default:"Your church" }}</span>
        </div>
        <div class="platform-brand-preview__body">
            <button type="button" class="btn btn-primary btn-sm mb-2">Primary action</button>
            <span class="platform-brand-preview__chip">Highlight</span>
        </div>
        <div class="d-flex gap-2 mt-3">
            <span class="platform-brand-swatch" data-swatch="brand" title="Brand"></span>
            <span class="platform-brand-swatch" data-swatch="action" title="Action"></span>
            <span class="platform-brand-swatch" data-swatch="highlight" title="Highlight"></span>
        </div>
    </div>
</div>
