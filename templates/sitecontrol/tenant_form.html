{% extends "sitecontrol/base_platform.html" %}

{% block page_title %}Edit {{ church.name }}{% endblock %}

{% block content %}
<div class="platform-card">
    <div class="platform-card-body">
        <form method="post">
            {% csrf_token %}
            <div class="platform-form-grid">
                {% for field in form %}
                <div class="{% if field.name == 'address' %}full-width{% endif %}">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
                </div>
                {% endfor %}
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Save Tenant</button>
                <a href="{% url 'sitecontrol:tenant_detail' church.pk %}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
